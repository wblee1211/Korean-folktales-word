<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3ba55d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<title>매일 단어 카드</title>
<style>
/* Layout: one-screen card deck, storybook-playful, big touch targets for a kid */
:root{
  --bg:#f2f8ee; --card:#ffffff; --fg:#243329; --muted:#6b7f70;
  --accent:#3ba55d; --accent-ink:#ffffff; --soft:#dcefd9;
  --no:#e2574c; --yes:#3ba55d; --line:#cfe3cc;
  --disp:'Jua',sans-serif; --body:'Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17211a; --card:#223026; --fg:#e8f1e9; --muted:#9db3a2;
  --accent:#4cbf72; --accent-ink:#0e1a12; --soft:#2b3d30;
  --no:#ef7066; --yes:#4cbf72; --line:#36493b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17211a; --card:#223026; --fg:#e8f1e9; --muted:#9db3a2;
  --accent:#4cbf72; --accent-ink:#0e1a12; --soft:#2b3d30;
  --no:#ef7066; --yes:#4cbf72; --line:#36493b; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);
  display:flex;flex-direction:column;padding-inline:16px;max-width:560px;margin-inline:auto}
h1,h2,.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:16px;font-size:16px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{display:flex;flex-direction:column;gap:16px;padding-block:18px;flex:1;min-height:0}
[hidden]{display:none!important}

/* home */
.logo{font-size:34px;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--soft);color:var(--fg);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.start{margin-top:auto;background:var(--accent);color:var(--accent-ink);font-size:20px;
  padding:16px;border-radius:20px;font-family:var(--disp)}
.streak{font-size:13px;color:var(--muted);text-align:center}

/* study */
.top{display:flex;align-items:center;gap:10px}
.top .home{background:var(--soft);color:var(--fg);padding:8px 12px;border-radius:12px;font-size:14px}
.bar{flex:1;height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:52px;text-align:right}

.cardwrap{flex:1;min-height:0;display:flex;perspective:1200px}
.card{position:relative;flex:1;border-radius:26px;transform-style:preserve-3d;transition:transform .45s;
  min-height:0;touch-action:pan-y}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);
  border:2px solid var(--line);border-radius:26px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.unit-tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted);
  background:var(--bg);padding:4px 10px;border-radius:999px}
.word{font-family:var(--disp);font-size:clamp(34px,9vw,52px);margin:0;text-wrap:balance}
.defi{font-size:16px;color:var(--muted);max-width:30ch;line-height:1.55;margin:0}
.ko{font-family:var(--disp);font-size:clamp(28px,8vw,44px);color:var(--accent);margin:0;text-wrap:balance}
.ex{font-size:16px;line-height:1.6;margin:0;max-width:32ch;font-style:italic;
  border-top:1.5px dashed var(--line);padding-top:12px}
.ex b{font-style:normal;color:var(--accent)}
.exbtn{background:var(--soft);color:var(--fg);padding:8px 14px;border-radius:999px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.speak{position:absolute;top:12px;right:14px;background:var(--accent);color:var(--accent-ink);
  border-radius:999px;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion: reduce){ .card{transition:none} .bar i{transition:none} }

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions button{padding:18px 10px;font-size:19px;border-radius:18px;color:#fff;font-family:var(--disp)}
.btn-no{background:var(--no)} .btn-yes{background:var(--yes);color:var(--accent-ink)}
.navrow{display:flex;justify-content:space-between;gap:10px}
.navrow button{background:none;color:var(--muted);font-size:14px;padding:6px 10px}

/* game */
.q-sent{font-size:20px;line-height:1.7;margin:0;max-width:34ch;text-align:center}
.q-sent b{color:var(--accent);letter-spacing:.06em}
.q-ko{font-size:15px;color:var(--muted);margin:0;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--card);border:2px solid var(--line);color:var(--fg);
  padding:16px 8px;font-size:18px;font-family:var(--disp);border-radius:16px}
.opts button.ok{background:var(--yes);border-color:var(--yes);color:var(--accent-ink)}
.opts button.bad{background:var(--no);border-color:var(--no);color:#fff;opacity:.75}
.opts button:disabled{cursor:default}
.gamebox{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:var(--card);border:2px solid var(--line);
  border-radius:26px;padding:22px;overflow:auto}

/* result */
.big{font-size:44px;text-align:center;margin:10px 0 0}
.score{text-align:center;font-size:18px;margin:0}
.misslist{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.miss{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;
  display:flex;justify-content:space-between;gap:10px;font-size:15px;align-items:baseline}
.miss b{font-family:var(--disp);font-weight:400;font-size:18px}
.miss span{color:var(--accent)}
.resbtns{display:flex;flex-direction:column;gap:10px}
.ghost{background:var(--soft);color:var(--fg);padding:14px;border-radius:16px;font-size:17px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<!-- HOME -->
<section id="home" class="screen">
  <h1 class="logo">🐸 매일 단어 카드</h1>
  <p class="sub">카드를 톡! 누르면 한국어 뜻이 나와요. 하루 한 세트씩 복습해요.</p>
  <div class="panel">
    <h2>어떤 단어를 볼까?</h2>
    <div class="chips" id="unitChips"></div>
  </div>
  <div class="panel">
    <h2>어떻게 볼까?</h2>
    <div class="chips" id="modeChips">
      <button class="chip" data-mode="en" aria-pressed="true">영어 → 뜻 맞히기</button>
      <button class="chip" data-mode="ko" aria-pressed="false">한국어 → 영어 맞히기</button>
      <button class="chip" data-mode="def" aria-pressed="false">영어 정의 → 단어 맞히기</button>
      <button class="chip" data-mode="game" aria-pressed="false">🎮 빈칸 채우기 게임</button>
    </div>
  </div>
  <p class="streak" id="streak"></p>
  <button class="start" id="startBtn">시작하기 ▶</button>
  <button class="ghost" id="reviewBtn" hidden>⭐ 어려웠던 단어만 다시 보기</button>
</section>

<!-- STUDY -->
<section id="study" class="screen" hidden>
  <div class="top">
    <button class="home" id="quitBtn">← 처음으로</button>
    <div class="bar"><i id="barFill"></i></div>
    <div class="count" id="count">1/24</div>
  </div>
  <div class="cardwrap">
    <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="face front">
        <span class="unit-tag" id="tagF"></span>
        <button class="speak" id="speakF" aria-label="소리로 듣기">🔊</button>
        <p class="word" id="frontMain"></p>
        <p class="defi" id="frontSub"></p>
        <p class="hint">👆 카드를 누르면 정답이 보여요</p>
      </div>
      <div class="face back">
        <span class="unit-tag" id="tagB"></span>
        <button class="speak" id="speakB" aria-label="소리로 듣기">🔊</button>
        <p class="word" id="backWord"></p>
        <p class="defi" id="backDef"></p>
        <p class="ko" id="backKo"></p>
        <p class="ex" id="backEx" hidden></p>
        <button class="exbtn" id="exBtn" hidden>▶ 예문 듣기</button>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn-no" id="noBtn">🤔 아직 어려워</button>
    <button class="btn-yes" id="yesBtn">😄 알아요!</button>
  </div>
  <div class="navrow">
    <button id="prevBtn">← 이전 카드</button>
    <button id="skipBtn">건너뛰기 →</button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen" hidden>
  <div class="top">
    <button class="home" id="gQuitBtn">← 처음으로</button>
    <div class="bar"><i id="gBarFill"></i></div>
    <div class="count" id="gCount">1/24</div>
  </div>
  <div class="gamebox">
    <p class="q-ko" id="gKo"></p>
    <p class="q-sent" id="gSent"></p>
    <button class="exbtn" id="gSpeak">🔊 문장 듣기</button>
  </div>
  <div class="opts" id="gOpts"></div>
</section>

<!-- RESULT -->
<section id="result" class="screen" hidden>
  <p class="big disp" id="resEmoji">🎉</p>
  <p class="score" id="resScore"></p>
  <h2 class="disp" id="missTitle" style="margin:4px 0 0">다시 볼 단어</h2>
  <div class="misslist" id="missList"></div>
  <div class="resbtns">
    <button class="start" id="againMissBtn">🤔 어려웠던 것만 다시</button>
    <button class="ghost" id="againAllBtn">전체 다시 하기</button>
    <button class="ghost" id="toHomeBtn">처음으로</button>
  </div>
</section>

 ["hiss","to make a long 's' sound like a cat","하악거리다, 쉭쉭거리다",5,"And whenever the Cat saw the Dog, she would hiss."],
];
const UNITS = {1:"청개구리 이야기", 2:"빨간 부채 파란 부채", 3:"손톱 먹은 쥐", 4:"반쪽이", 5:"개와 고양이"};

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

let selUnit = 0;           // 0 = 전체
let mode = "en";
let deck = [], idx = 0, misses = [], flipped = false;

/* ---------- home ---------- */
function buildChips(){
  const wrap = $("unitChips");
  const mk = (label, val)=>{
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(val===selUnit));
    b.onclick = ()=>{ selUnit = val; [...wrap.children].forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); };
    wrap.appendChild(b);
  };
  mk("전체 ("+WORDS.length+")", 0);
  for(const u of Object.keys(UNITS).map(Number)) mk(UNITS[u]+" ("+WORDS.filter(w=>w[3]===u).length+")", u);

  $("modeChips").querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ mode = b.dataset.mode;
      $("modeChips").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); };
  });
}
function refreshHome(){
  const s = store.get("streak") || {days:0,last:""};
  $("streak").textContent = s.days>0 ? `🔥 ${s.days}일 연속 공부 중!` : "오늘부터 시작해 볼까요?";
  const hard = store.get("hard") || [];
  $("reviewBtn").hidden = hard.length===0;
  if(hard.length) $("reviewBtn").textContent = `⭐ 어려웠던 단어만 다시 보기 (${hard.length}개)`;
}
function markToday(){
  const today = new Date().toISOString().slice(0,10);
  const s = store.get("streak") || {days:0,last:""};
  if(s.last===today) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.days = (s.last===y) ? s.days+1 : 1;
  s.last = today; store.set("streak", s);
}

/* ---------- study ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

function startDeck(cards){
  if(mode==="game"){
    const withEx = cards.filter(c=>c[4]);
    if(!withEx.length){
      $("streak").textContent = "이 세트에는 아직 예문이 없어요. 예문이 있는 세트를 골라 주세요!";
      return;
    }
    deck = shuffle(withEx.slice()); idx = 0; misses = [];
    $("home").hidden = true; $("result").hidden = true; $("game").hidden = false;
    showQuestion();
    return;
  }
  deck = shuffle(cards.slice()); idx = 0; misses = [];
  $("home").hidden = true; $("result").hidden = true; $("study").hidden = false;
  showCard();
}

/* ---------- 빈칸 채우기 게임 ---------- */
const IRREG = { spring:["sprang","sprung"], bite:["bit"] };  // 예문 속 불규칙 변화형
let gWrong = false;
function wordForm(en, ex){
  const stems = [en, ...(IRREG[en]||[])];
  for(const s of stems){
    const re = new RegExp("\\b("+s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
    const m = ex.match(re);
    if(m) return m[1];
  }
  return null;
}
function showQuestion(){
  gWrong = false;
  const [en, , ko, , ex] = deck[idx];
  const form = wordForm(en, ex);
  const blank = "＿".repeat(Math.max(4, Math.min(8, en.length)));
  $("gSent").textContent = form ? ex.replace(form, blank) : ex;
  $("gKo").textContent = ko;
  $("gCount").textContent = (idx+1)+"/"+deck.length;
  $("gBarFill").style.width = (idx/deck.length*100)+"%";
  // 보기: 정답 + 같은 덱에서 오답 3개
  const others = shuffle(deck.filter(d=>d[0]!==en)).slice(0,3).map(d=>d[0]);
  const opts = shuffle([en, ...others]);
  const wrap = $("gOpts"); wrap.innerHTML = "";
  for(const o of opts){
    const b = document.createElement("button");
    b.textContent = o;
    b.onclick = ()=>{
      if(o===en){
        b.classList.add("ok");
        [...wrap.children].forEach(c=>c.disabled=true);
        if(gWrong) misses.push(deck[idx]);
        // 빈칸을 정답으로 채워서 보여주고 문장 읽기
        $("gSent").textContent = "";
        const filled = form ? ex.split(form) : [ex];
        if(form){
          $("gSent").appendChild(document.createTextNode(filled[0]));
          const bb = document.createElement("b"); bb.textContent = form;
          $("gSent").appendChild(bb);
          $("gSent").appendChild(document.createTextNode(filled.slice(1).join(form)));
        } else $("gSent").textContent = ex;
        speak(ex, "en-US");
        setTimeout(()=>{ if(idx<deck.length-1){ idx++; showQuestion(); } else finish(); }, 1600);
      } else {
        gWrong = true;
        b.classList.add("bad"); b.disabled = true;
      }
    };
    wrap.appendChild(b);
  }
}
function speakFront(){
  const [en, def, ko] = deck[idx];
  if(mode==="ko") speak(ko, "ko-KR");
  else if(mode==="def") speak(def, "en-US");
  else speak(en, "en-US");
}
function speakSeq(parts){                          // [텍스트, 언어] 순서대로 이어 읽기
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    for(const [text, lang] of parts){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = 0.85;
      const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith(lang));
      if(v) u.voice = v;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
function speakBack(){
  const [en,,ko,,ex] = deck[idx];
  const parts = [[en,"en-US"],[ko.replace(/[()~;,]/g," "),"ko-KR"]];
  if(ex) parts.push([ex,"en-US"]);
  speakSeq(parts);
}
function showCard(){
  flipped = false; $("card").classList.remove("flip");
  const [en, def, ko, u, ex] = deck[idx];
  $("tagF").textContent = $("tagB").textContent = UNITS[u];
  const exEl = $("backEx");
  exEl.hidden = $("exBtn").hidden = !ex;
  if(ex){
    exEl.innerHTML = "";
    // 예문 속 표제어를 강조 표시
    const re = new RegExp("("+en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
    const parts = ex.split(re);
    for(const p of parts){
      if(re.test(p) && p.toLowerCase().startsWith(en.split(" ")[0].toLowerCase())){
        const b = document.createElement("b"); b.textContent = p; exEl.appendChild(b);
      } else exEl.appendChild(document.createTextNode(p));
    }
  }
  if(mode==="en"){ $("frontMain").textContent = en; $("frontSub").textContent = def; }
  else if(mode==="ko"){ $("frontMain").textContent = ko; $("frontSub").textContent = ""; }
  else { $("frontMain").textContent = "❓"; $("frontSub").textContent = def; }
  $("backWord").textContent = en; $("backDef").textContent = def; $("backKo").textContent = ko;
  $("count").textContent = (idx+1)+"/"+deck.length;
  $("barFill").style.width = (idx/deck.length*100)+"%";
  speakFront();                                   // 카드가 열리면 바로 읽어주기
}
function answer(known){
  if(!known) misses.push(deck[idx]);
  next();
}
function next(){
  if(idx < deck.length-1){ idx++; showCard(); } else finish();
}
function prev(){ if(idx>0){ idx--; showCard(); } }

function finish(){
  markToday();
  $("barFill").style.width = "100%";
  $("study").hidden = true; $("game").hidden = true; $("result").hidden = false;
  const ok = deck.length - misses.length;
  $("resEmoji").textContent = misses.length===0 ? "🏆" : (ok/deck.length>=0.7 ? "🎉" : "💪");
  $("resScore").textContent = `${deck.length}개 중 ${ok}개 알았어요!`;
  const list = $("missList"); list.innerHTML = "";
  $("missTitle").hidden = $("againMissBtn").hidden = misses.length===0;
  for(const [en,def,ko] of misses){
    const d = document.createElement("div"); d.className="miss";
    d.innerHTML = `<b></b><span></span>`;
    d.querySelector("b").textContent = en; d.querySelector("span").textContent = ko;
    list.appendChild(d);
  }
  // 어려운 단어 저장(기기별): 이번에 틀린 단어 목록으로 갱신
  const prevHard = store.get("hard") || [];
  const merged = [...prevHard.filter(h=>!deck.some(d0=>d0[0]===h[0]&&d0[3]===h[3])), ...misses];
  store.set("hard", merged);
  refreshHome();
}

/* ---------- events ---------- */
buildChips(); refreshHome();

$("startBtn").onclick = ()=>{
  const cards = selUnit===0 ? WORDS : WORDS.filter(w=>w[3]===selUnit);
  startDeck(cards);
};
$("reviewBtn").onclick = ()=>{ const h = store.get("hard")||[]; if(h.length) startDeck(h); };
$("quitBtn").onclick = $("gQuitBtn").onclick = $("toHomeBtn").onclick = ()=>{ $("study").hidden=true; $("game").hidden=true; $("result").hidden=true; $("home").hidden=false; refreshHome(); };
$("gSpeak").onclick = ()=>{ const ex = deck[idx][4]; if(ex) speak(ex, "en-US"); };
$("againMissBtn").onclick = ()=>{ if(misses.length) startDeck(misses); };
$("againAllBtn").onclick = ()=>startDeck(deck);
$("noBtn").onclick = ()=>answer(false);
$("yesBtn").onclick = ()=>answer(true);
$("prevBtn").onclick = prev;
$("skipBtn").onclick = next;

const card = $("card");
const flip = ()=>{
  flipped=!flipped; card.classList.toggle("flip", flipped);
  if(flipped) speakBack();                        // 뒤집으면 단어 + 예문 자동 읽기
  else speakFront();
};
card.onclick = flip;
card.onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };

// 발음 듣기 (Web Speech API)
function speak(text, lang){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith(lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if("speechSynthesis" in window) speechSynthesis.getVoices(); // iOS 음성 목록 미리 로드
$("speakF").onclick = e=>{
  e.stopPropagation();
  const [en,def,,/*u*/] = deck[idx];
  if(mode==="ko") speak(deck[idx][2], "ko-KR");
  else if(mode==="def") speak(def, "en-US");
  else speak(en, "en-US");
};
$("speakB").onclick = e=>{ e.stopPropagation(); speak(deck[idx][0], "en-US"); };
$("exBtn").onclick = e=>{
  e.stopPropagation();
  const ex = deck[idx][4];
  if(ex) speak(ex, "en-US");
};

// swipe left/right to move between cards
let sx=null;
card.addEventListener("touchstart", e=>{ sx = e.touches[0].clientX; }, {passive:true});
card.addEventListener("touchend", e=>{
  if(sx===null) return;
  const dx = e.changedTouches[0].clientX - sx; sx=null;
  if(dx < -60) next(); else if(dx > 60) prev();
}, {passive:true});
</script>
